[project]
name = "giralibros"
version = "0.1.0"
description = "Book exchange platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2.2",
    "flask-migrate>=4.1.0",
    "flask-mail>=0.10.0",
    "flask-admin>=1.6.1",
    "gunicorn>=23.0.0",
    "pillow>=12.0.0",
    "itsdangerous>=2.2.0",
    "email-validator>=2.2.0",
    "markupsafe>=3.0.2",
    "werkzeug>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-flask>=1.3.0",
]
